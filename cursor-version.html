<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ziad Mohamed — Flame Cursor</title><style>html,body{margin:0;background:#040407}</style></head><body><script>
(async()=>{const src='https://raw.githubusercontent.com/zeyadtag/My-portfolio-/97bf6115650cabaf7ed2bb38ea1b1b27b4aa04f9/index.html';let h=await (await fetch(src)).text();const css=`<style>
.fire-arrow{display:none!important}
@media(pointer:fine){html,body,a,button{cursor:none!important}.mouse-fire-cursor{position:fixed;left:0;top:0;width:28px;height:36px;z-index:99999;pointer-events:none;transform:translate3d(-100px,-100px,0);will-change:transform;filter:drop-shadow(0 0 7px rgba(255,60,82,.8)) drop-shadow(0 0 17px rgba(111,76,255,.42))}.mouse-fire-cursor .arrow{position:absolute;left:2px;top:1px;width:22px;height:29px;background:linear-gradient(155deg,#fff 0 20%,#ffb0b8 21% 37%,#ff4057 38% 64%,#7b4dff 85%);clip-path:polygon(0 0,0 78%,23% 61%,39% 100%,54% 94%,39% 58%,72% 58%);transform-origin:6px 5px;transition:transform .15s ease,filter .15s ease}.mouse-fire-cursor.hot .arrow{transform:scale(1.2) rotate(-3deg);filter:brightness(1.4)}.cursor-glow{position:fixed;left:0;top:0;width:42px;height:42px;border-radius:50%;z-index:99997;pointer-events:none;transform:translate3d(-100px,-100px,0);background:radial-gradient(circle,rgba(255,55,79,.2),rgba(119,70,255,.09) 42%,transparent 72%);filter:blur(5px)}.cursor-ember{position:fixed;z-index:99998;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff4ca 0 12%,#ffac3d 28%,#ff3d55 62%,#7b4dff 100%);box-shadow:0 0 8px rgba(255,73,82,.75);animation:ce var(--d) cubic-bezier(.18,.58,.25,1) forwards}.cursor-flame{position:fixed;z-index:99996;pointer-events:none;width:11px;height:19px;border-radius:60% 40% 70% 30%;background:radial-gradient(ellipse at 50% 86%,#fff3c6 0 8%,#ff9c32 25%,#ff344e 54%,rgba(120,70,255,.55) 78%,transparent 100%);filter:blur(3px);mix-blend-mode:screen;animation:cf var(--d) ease-out forwards}@keyframes ce{to{transform:translate3d(var(--x),var(--y),0) scale(.05);opacity:0}}@keyframes cf{0%{transform:scale(.9) rotate(var(--r));opacity:.95}100%{transform:translate3d(var(--x),var(--y),0) scale(.15) rotate(var(--r));opacity:0}}}
</style>`;
const js=`<script>(()=>{if(!matchMedia('(pointer:fine)').matches)return;document.querySelector('.fire-arrow')?.remove();const c=document.createElement('div');c.id='mouseFireCursor';c.className='mouse-fire-cursor';c.innerHTML='<span class="arrow"></span>';document.body.appendChild(c);const g=document.createElement('div');g.className='cursor-glow';document.body.appendChild(g);let tx=-100,ty=-100,cx=-100,cy=-100,gx=-100,gy=-100,lx=-100,ly=-100,ls=0;const interactive='a,button,.project-screen,.card,.bottom-nav a';function trail(x,y,s){const n=performance.now();if(n-ls<Math.max(17,48-s*.42))return;ls=n;const f=document.createElement('i');f.className='cursor-flame';const bx=(lx-x)*.34,by=(ly-y)*.34;f.style.left=(x-5+bx)+'px';f.style.top=(y+12+by)+'px';f.style.setProperty('--x',(-bx*2+(Math.random()-.5)*18)+'px');f.style.setProperty('--y',(18+Math.random()*32)+'px');f.style.setProperty('--r',(-12+Math.random()*24)+'deg');f.style.setProperty('--d',(.3+Math.random()*.35)+'s');document.body.appendChild(f);setTimeout(()=>f.remove(),800);if(Math.random()<Math.min(.8,.18+s/60)){const e=document.createElement('i');e.className='cursor-ember';const z=2+Math.random()*4;e.style.width=e.style.height=z+'px';e.style.left=(x-2)+'px';e.style.top=(y+16)+'px';e.style.setProperty('--x',((Math.random()-.5)*(28+s*.5))+'px');e.style.setProperty('--y',(14+Math.random()*36)+'px');e.style.setProperty('--d',(.35+Math.random()*.46)+'s');document.body.appendChild(e);setTimeout(()=>e.remove(),950)}}addEventListener('pointermove',e=>{const dx=e.clientX-lx,dy=e.clientY-ly,s=Math.min(90,Math.hypot(dx,dy));tx=e.clientX;ty=e.clientY;trail(tx,ty,s);lx=tx;ly=ty;c.classList.toggle('hot',!!e.target.closest(interactive))});addEventListener('pointerdown',()=>{for(let i=0;i<16;i++)setTimeout(()=>{const e=document.createElement('i');e.className='cursor-ember';const z=2+Math.random()*5;e.style.width=e.style.height=z+'px';e.style.left=tx+'px';e.style.top=(ty+13)+'px';e.style.setProperty('--x',((Math.random()-.5)*86)+'px');e.style.setProperty('--y',((Math.random()-.5)*86)+'px');e.style.setProperty('--d',(.34+Math.random()*.38)+'s');document.body.appendChild(e);setTimeout(()=>e.remove(),900)},i*8)});(function tick(){cx+=(tx-cx)*.38;cy+=(ty-cy)*.38;gx+=(tx-gx)*.16;gy+=(ty-gy)*.16;c.style.transform='translate3d('+(cx-3)+'px,'+(cy-2)+'px,0)';g.style.transform='translate3d('+(gx-21)+'px,'+(gy-21)+'px,0)';requestAnimationFrame(tick)})()})();<\/script>`;h=h.replace('</head>',css+'</head>').replace('</body>',js+'</body>');document.open();document.write(h);document.close()})().catch(e=>{document.body.innerHTML='<pre style="color:white">'+e+'</pre>'})
</script></body></html>
